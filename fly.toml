# Fly.io deployment config. Run `fly launch --no-deploy` once to create the app,
# then `fly deploy`. Set an app name below or let `fly launch` pick one.
app = "harmonyx-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"

[env]
  PORT = "8000"
