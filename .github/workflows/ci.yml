name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Run key-detection eval (regression gate)
        run: python -m eval.run_eval --min 0.85
      - name: Run generation eval (round-trip + rule violations)
        run: python -m eval.run_generation_eval --min-roundtrip 1.0 --max-violations 0
      - name: Run RN-agreement eval (visibility only, not yet a gate)
        run: python -m eval.run_rn_eval --min 0.0
